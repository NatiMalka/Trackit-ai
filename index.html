<!doctype html>
<html lang="he" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TrackIt AI — מעקב חבילות חכם</title>
    <meta
      name="description"
      content="מעקב חבילות חכם בעברית. TrackIt AI מתרגם את הסטטוס לשפה פשוטה, מזהה חבילות תקועות ומזכיר לאסוף לפני שהחבילה חוזרת לשולח."
    />
    <meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TrackIt AI" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/apple-touch-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/apple-touch-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Heebo:wght@300;400;500;600;700&display=swap"
    />
    <script>
      // Applied before first paint so the app never flashes the wrong theme.
      (function () {
        try {
          var saved = localStorage.getItem('trackit.theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          /* private mode: keep the dark default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
